name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clouddoc
          POSTGRES_USER: clouddoc
          POSTGRES_PASSWORD: clouddoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clouddoc -d clouddoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      DB_NAME: clouddoc
      DB_USER: clouddoc
      DB_PASSWORD: clouddoc
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_S3_BUCKET_NAME: clouddoc-ci-smoke
      SQS_QUEUE_NAME: clouddoc-ci-processing
      SQS_DLQ_NAME: clouddoc-ci-processing-dlq

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py setup_sqs
      - name: Wait for Floci
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:4566/_localstack/health
      - name: Exercise document upload against Floci
        run: python scripts/ci_floci_smoke.py
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
      - name: Build API and worker image
        run: docker build -t clouddoc:ci .
