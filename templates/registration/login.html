<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · CloudDoc</title>
  </head>
  <body>
    <main>
      <h1>Sign in to CloudDoc</h1>
      {% if form.errors %}<p>Your username or password was incorrect.</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}" />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
